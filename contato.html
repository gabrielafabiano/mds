<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
        <h1>Contato</h1>

        <nav class="menu">
            <ul>
                <li><a href="inicio.html">Início</a></li>
                <li><a href="sobreoprojeto.html">Sobre o Projeto</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </center>
    <center>
        <form class="contato">
            <h2>Entre em contato conosco</h2>

            <blockquote class="sug">
                Caso tenha dúvidas, sugestões ou queira entrar em contato sobre o projeto, envie uma mensagem por
                e-mail.
            </blockquote>

            <div class="form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Insira seu nome" />
            </div>

            <div class="form">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="Insira seu e-mail" />
            </div>

            <div class="form">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem..."></textarea>
            </div>

            <div class="botao">
                <button type="submit" class="botao-enviar">Enviar</button>
            </div>
        </form>
    </center>
</body>

</html>
